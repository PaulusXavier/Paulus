<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paulus · Console</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#02070c"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Paulus_IA">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' https://*.workers.dev; img-src 'self' data:">
<style>
:root{--c:#37e6ff;--t:#d6f7ff;--a:#ffb347;--mut:#7fb7c4;--bd:#37e6ff44;--bg2:#04151f;--ok:#6ee7a8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 0%,#0c2a3d,#02070c 70%);color:var(--t);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#orb{position:fixed;top:0;left:0;width:100%;height:76px;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;font:11px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#7fd9e8;z-index:3}
header b{color:var(--c)}
.hl{display:flex;flex-direction:column;gap:2px;min-width:0}
#st{color:var(--a)}
.hr{display:flex;align-items:center;gap:4px}
.hb{min-height:30px!important;min-width:30px;padding:0 8px!important;font-size:13px!important;border-color:#37e6ff44!important}
#hr{margin-left:4px;opacity:.8}
#log{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));bottom:var(--bar,150px);width:min(820px,96vw);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px 10px;overscroll-behavior:contain}
.m{max-width:94%;padding:10px 14px;border-radius:12px;word-break:break-word;position:relative}
.u{align-self:flex-end;background:#0f3a4f;border:1px solid #37e6ff55}
.p{align-self:flex-start;background:var(--bg2);border:1px solid var(--bd);width:fit-content}
.m p{margin:0 0 8px}.m p:last-child{margin:0}.m ul,.m ol{margin:4px 0 8px;padding-left:22px}
.m h3,.m h4{margin:10px 0 4px;color:var(--c);font-size:15px}.m h3{font-size:16px}
.m code{font:13px ui-monospace,Menlo,monospace;background:#0a2c3c;padding:1px 5px;border-radius:4px}
.m a{color:var(--a)}
.cb{position:relative;margin:6px 0 10px}
.cb pre{margin:0;overflow:auto;background:#020d14;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:13px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
.cb button{position:absolute;top:4px;right:4px;min-height:0;padding:2px 8px;font-size:11px}
.tw{overflow:auto;margin:6px 0 10px}
.m table{border-collapse:collapse;font-size:14px}.m th,.m td{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}.m th{background:#0a2c3c}
.f{font-size:12px;color:var(--mut);margin-top:8px}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ac button,.ch{font-size:12px;padding:4px 10px;min-height:30px}
.ue{position:absolute;left:-2px;bottom:-12px;opacity:0;transition:opacity .15s;min-height:0;padding:1px 8px;font-size:11px;transform:translateX(-100%) translateX(2px);bottom:6px}
.u:hover .ue,.u:focus-within .ue{opacity:1}
@media(hover:none){.ue{opacity:.8}}
.hi{align-self:center;text-align:center;color:#9fdce8;max-width:600px;margin-top:3vh}
.hi h2{margin:0 0 6px;font-size:20px;color:var(--c);font-weight:600}
.hi p{margin:0 0 10px}
.hi small{display:block;color:var(--mut);margin-top:10px;font-size:12px}
.ch{margin:4px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid #37e6ff55;border-radius:4px;padding:0 5px;background:#06202e}
#dn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar,150px) + 8px);z-index:4;min-height:32px;font-size:12px;padding:0 12px;background:#06202e;box-shadow:0 2px 12px #0008}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(820px,96vw);display:flex;flex-direction:column;gap:6px}
#tb{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#tb button{flex:none;min-height:32px;font-size:12px;padding:0 10px;border-radius:16px;white-space:nowrap}
#fl{display:flex;gap:6px;flex-wrap:wrap}
#fl:empty{display:none}
.fc{display:inline-flex;align-items:center;gap:6px;background:#0f3a4f;border:1px solid #37e6ff66;border-radius:14px;padding:2px 4px 2px 10px;font-size:12px;max-width:100%}
.fc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.fc button{min-height:22px;min-width:22px;padding:0;border-radius:11px;font-size:12px;line-height:1}
#pi{font-size:12px;color:var(--a);min-height:0}
#pi:empty{display:none}
#row{display:flex;gap:6px;align-items:flex-end;position:relative}
#q{flex:1;min-width:0;resize:none;max-height:160px;background:#03121b;border:1px solid #37e6ff99;color:var(--t);padding:12px;border-radius:12px;font:inherit}
button{background:#06202e;color:var(--c);border:1px solid #37e6ff88;border-radius:10px;padding:0 12px;min-height:44px;min-width:44px;font:inherit;cursor:pointer}
button:hover{border-color:var(--c)}
.ac button,.ch{min-height:0}button.on{background:var(--c);color:#02121a}
button:focus-visible,#q:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:1px}
#go{background:var(--c);color:#02121a;font-weight:600;min-width:84px}
#go.stop{background:#ff6b5e;border-color:#ff6b5e;color:#1a0502}
#sl{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:#041a26;border:1px solid #37e6ff88;border-radius:12px;max-height:min(46vh,320px);overflow:auto;box-shadow:0 6px 24px #000a;z-index:5}
#sl[hidden]{display:none}
#sl div{padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
#sl div b{color:var(--c);font:600 13px ui-monospace,Menlo,monospace;flex:none;min-width:84px}
#sl div span{color:#9fdce8;font-size:13px}
#sl div.sel,#sl div:hover{background:#0f3a4f}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#02101acc;color:var(--c);font-size:20px;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:520px){header{font-size:10px}#hr{display:none}.hi h2{font-size:18px}.m{max-width:98%}#go{min-width:64px;padding:0 8px}}
@media(prefers-reduced-motion:reduce){#orb{display:none}#log{scroll-behavior:auto}}
</style></head><body>
<canvas id="orb" aria-hidden="true"></canvas>
<header>
<div class="hl"><span><b>PAULUS_IA</b> · CONSOLE</span><span id="st" role="status" aria-live="polite">EM ESPERA</span></div>
<div class="hr">
<button id="ins" class="hb" hidden>Instalar</button>
<button id="ex" class="hb" title="Salvar a conversa em arquivo (.md)" aria-label="Salvar a conversa">⤓</button>
<button id="nv" class="hb" title="Nova conversa (Ctrl+Shift+N)" aria-label="Nova conversa">↺</button>
<button id="vz" class="hb" title="Ler as respostas em voz alta" aria-label="Voz" aria-pressed="false">🔊</button>
<span id="hr"></span>
</div>
</header>
<main id="log" role="log" aria-live="polite" aria-label="Conversa"></main>
<button id="dn" hidden>↓ Ir para o fim</button>
<div id="drop">Solte o arquivo aqui (PDF e fotos ficam no aparelho)</div>
<div id="bar">
<div id="tb" role="toolbar" aria-label="Atalhos de tarefas"></div>
<div id="fl" aria-label="Arquivos anexados"></div>
<div id="pi" role="status"></div>
<div id="row">
<div id="sl" role="listbox" aria-label="Atalhos" hidden></div>
<button id="at" title="Anexar PDF ou foto" aria-label="Anexar arquivo">📎</button>
<button id="mic" title="Ditar por voz" aria-label="Ditar">🎤</button>
<textarea id="q" rows="1" placeholder="Pergunte ou digite / para atalhos…" aria-label="Pergunta"></textarea>
<button id="go">Enviar</button>
<input type="file" id="fi" class="sr" multiple accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" tabindex="-1" aria-hidden="true">
</div>
</div>
<script src="paulus.v1.js"></script>
<script src="console.js"></script>
</body></html>
