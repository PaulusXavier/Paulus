# Publica o Worker do Paulus (paulus-ia) na Cloudflare a cada push na main, depois de rodar os testes.
# Precisa de 2 segredos no GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token com o modelo "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  ID da conta (aparece no painel da Cloudflare, em Workers & Pages)
name: Deploy do Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
