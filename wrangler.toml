# USO INDIVIDUAL, SEM FINS COMERCIAIS: este Worker é só de Paulo Xavier (veja USO-INDIVIDUAL.md).
# Publicação pelo terminal:  npx wrangler deploy
# (pelo painel da Cloudflare também funciona; veja docs/DEPLOY.md)
name = "paulus-ia"
main = "worker/index.mjs"
compatibility_date = "2025-01-01"

# Gera knowledge/conhecimento.json, indice.json, worker-base.json e habilidades.json (nenhum fica no Git) antes de cada publicação.
# As duas etapas são necessárias: o worker/index.mjs importa os quatro arquivos.
[build]
command = "node scripts/build-knowledge.mjs && node scripts/build-habilidades.mjs"

[ai]
binding = "AI"

[vars]
# Endereços dos apps que podem usar o Paulus, separados por vírgula, SEM barra no fim.
# É só o "site" (esquema + domínio), sem o caminho: https://paulusxavier.github.io
ALLOWED_ORIGINS = "https://paulusxavier.github.io"
# Login pelo Firebase (opcional; vale para o console e para todos os apps que usam o mesmo projeto Firebase).
# Com FIREBASE_PROJECT_ID o Worker só responde a quem mandar um ID token do Firebase (Authorization: Bearer ...). Veja docs/DEPLOY.md.
FIREBASE_PROJECT_ID = "paulusia-de285"
# Quem pode entrar (opcional; sem as listas, qualquer conta do projeto entra, então DESLIGUE o cadastro livre no Firebase):
# FIREBASE_EMAILS = "paulo@exemplo.org,ana@exemplo.org"
# FIREBASE_DOMINIOS = "prefeitura.exemplo.gov.br"

# Modelos (opcionais; os padrões já são estes):
# O Paulus usa o modelo grande, que raciocina e segue bem as regras. Ele gasta mais da cota gratuita diária da
# Cloudflare; quando a cota acaba (ou o modelo falha), o Worker passa sozinho para o modelo pequeno.
# MODELO = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# MODELO_RESERVA = "@cf/meta/llama-3.1-8b-instruct"
# Passo que reescreve a pergunta antes de responder (padrão: o mesmo MODELO):
# MODELO_INTERPRETE = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Não há chave de API: o Workers AI usa a sua própria conta Cloudflare.
# Passo de raciocínio (perguntas de análise): uma chamada a mais, só nessas perguntas. "desligado" pula o passo e poupa cota.
# RACIOCINIO = "desligado"
# MODELO_RACIOCINIO = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# Consulta de UMA unidade (só telefone, endereço ou horário) com a ficha enviada pelo app: o Worker copia a ficha e não chama a IA.
# "desligado" manda toda consulta para a IA, como antes.
# CONSULTA_DIRETA = "desligado"
# Resposta local (shared/resposta-local.mjs): contagem de equipamentos por bairro, dados de Boa Vista, perguntas frequentes do Bolsa Família/CadÚnico
# e "o que é <SIGLA>?" saem direto da base e do diretório, sem chamar a IA (poupa a cota). "desligado" manda tudo para a IA, como antes.
# RESPOSTA_LOCAL = "desligado"
# Autocorreção de citações: se a resposta cita artigo, lei ou valor que a IA não leu nas fontes, uma chamada a mais a reescreve sem a citação.
# "desligado" pula o passo (o navegador continua avisando).
# CORRECAO = "desligado"

# Leitura de imagem (opcional): o Paulus lê foto/print anexado por um modelo de visão. Os padrões já são estes:
# MODELO_VISAO = "@cf/meta/llama-3.2-11b-vision-instruct"
# MODELO_VISAO_RESERVA = "@cf/meta/llama-4-scout-17b-16e-instruct"
# VISAO = "desligado"   # recusa qualquer imagem (a foto vai à IA da Cloudflare antes do filtro de dados pessoais; veja docs/SEGURANCA.md)

# Voz própria (opcional, v0.22.0): servidor de voz clonada em voz-servidor/ (veja o README de lá). Os dois valores entram como SEGREDO, não aqui:
#   npx wrangler secret put VOZ_URL     (https://..., sem barra no fim)
#   npx wrangler secret put VOZ_TOKEN
# Sem VOZ_URL a rota /voz responde 404 e o console fala com a voz do navegador.

# Cota da IA no console (opcional): o painel (botão de medidor ou /cota) mostra quanto da franquia diária do Workers AI foi usada,
# quando acaba e quando renova. Para ler o consumo, dois SEGREDOS (veja "Cota da IA no console" em docs/DEPLOY.md):
#   npx wrangler secret put COTA_CF_CONTA   (ID da conta Cloudflare)
#   npx wrangler secret put COTA_CF_TOKEN   (token só com Conta > Análises da conta > Leitura)
# Sem eles o painel mostra só a hora da renovação (00:00 UTC). Franquia diária em neurons (padrão 10000; só mude se a Cloudflare mudar):
# COTA_NEURONS = "10000"
# Histórico de 7 dias no painel da cota (mesma consulta, janela maior). "desligado" pede só o dia de hoje:
# COTA_HISTORICO = "desligado"

# IA de reserva EXTERNA (opcional): quando a cota gratuita da Cloudflare acaba, o Worker tenta este provedor (API compatível com a OpenAI:
# Groq, Gemini no endpoint OpenAI-compatível, OpenRouter, Together, Mistral...). Fica DESLIGADA sem as três variáveis. Veja docs/DEPLOY.md e docs/SEGURANCA.md.
# Os nomes de modelo mudam com frequência: confira o atual na documentação do provedor. A chave entra como SEGREDO, não aqui:
#   npx wrangler secret put IA_EXTERNA_CHAVE
# IA_EXTERNA_URL = "https://api.groq.com/openai/v1"     # https, sem barra no fim (se terminar em /chat/completions, vale como está)
# IA_EXTERNA_MODELO = "nome-do-modelo-no-provedor"
# IA_EXTERNA = "desligado"                              # desliga mesmo com as três definidas
# Nunca vão ao provedor externo: foto/PDF escaneado, documento anexado e conversa sobre suicídio ou autolesão (continua o 503 de cota de antes).

# Limite de pedidos GLOBAL por IP (recomendado): o contador em memória do Worker vale só por instância, então um abuso espalhado passa por ele.
# Descomente e CONFIRA a sintaxe na documentação atual da Cloudflare ("Workers Rate Limiting binding"); o handler usa env.LIMITADOR se existir.
# [[unsafe.bindings]]
# name = "LIMITADOR"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 16, period = 60 }
